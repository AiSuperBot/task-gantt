# build on tag push and attach artifacts to the release
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write # required to sign attestations
  attestations: write # create artifact attestations

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      # install from the lock, build only if tests pass
      - name: Build plugin
        run: |
          npm ci
          npm test
          npm run build

      # minify only the shipped styles.css (the commented source in the repo stays as is)
      - name: Minify styles
        run: npx esbuild styles.css --minify --outfile=styles.css --allow-overwrite

      # attest the provenance of the build artifacts
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          gh release create "$tag" \
            --title="$tag" \
            --notes="Release $tag" \
            main.js manifest.json styles.css
